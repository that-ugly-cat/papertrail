<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}PaperTrail{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1">
  {% block head %}{% endblock %}
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">PaperTrail</a>
  <nav>
    <a href="/">Workspace</a>
    <a href="/profile">Profilo</a>
    {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <a href="/logout">Esci</a>
  </nav>
</header>
{% endif %}
<main class="{% block main_class %}container{% endblock %}">
{% block body %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
