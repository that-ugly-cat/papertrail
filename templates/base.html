<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}PaperTrail{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=15">
  <script>
    // Runs before the first paint, so a user who chose light never sees a dark
    // frame. Kept inline and tiny on purpose: an external file would load too
    // late. The toggle itself is in theme.js.
    (function () {
      try {
        if (window.localStorage.getItem("papertrail-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/app">PaperTrail</a>
  <nav>
    <a href="/app">Workspaces</a>
    <a href="/me">My work</a>
    <a href="/profile">Profile</a>
    {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <a href="/logout">Log out</a>
    <button type="button" class="theme-toggle" aria-label="Switch theme" title="Switch theme" aria-pressed="false"><span class="theme-icon-dark" aria-hidden="true">&#9788;</span><span class="theme-icon-light" aria-hidden="true">&#9790;</span></button>
  </nav>
</header>
{% endif %}
<main class="{% block main_class %}container{% endblock %}">
{% block body %}{% endblock %}
</main>
<script src="/static/js/theme.js?v=1"></script>
{% block scripts %}{% endblock %}
</body>
</html>
